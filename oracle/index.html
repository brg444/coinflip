<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oracle</title>
  <link rel="stylesheet" href="/page.css">
</head>
<body>
<main>
  <h1>Oracle</h1>
  <section id="status"></section>
  <section>
    <p class="muted">DIA signs the price. The admin token is sent only as a bearer. It does not sign the price.</p>
    <label>Admin token <input id="token" type="password" autocomplete="off"></label>
    <button id="issue" type="button">Issue</button>
    <button id="recover" type="button">Recover pending</button>
    <button id="deploy" type="button">Deploy</button>
    <p id="admin-error" class="err"></p>
  </section>
  <section>
    <h2>Settlement</h2>
    <p class="muted">Typing a price previews the vault payoff. It does not record a sample and it does not publish.</p>
    <label>Kind
      <select id="kind">
        <option value="0">Covered call</option>
        <option value="1">Limited put</option>
      </select>
    </label>
    <label>Price, USD cents <input id="settle-price" inputmode="numeric" autocomplete="off"></label>
    <label>Strike, USD cents <input id="strike" inputmode="numeric" autocomplete="off"></label>
    <label>Collateral, sats <input id="collateral" inputmode="numeric" autocomplete="off"></label>
    <p id="payout" class="mono"></p>
    <p class="muted">Publish writes the DIA print whose timestamp sits in [expiry, expiry + 60].</p>
    <label>Expiry, unix seconds <input id="expiry" inputmode="numeric" autocomplete="off"></label>
    <button id="publish-price" type="button">Publish price</button>
    <p id="publish-error" class="err"></p>
  </section>
</main>
<script type="module" src="/page.js"></script>
</body>
</html>
