name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: contracts/go/go.mod
          cache-dependency-path: contracts/go/go.sum

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Unit & Integration Tests
        run: pnpm test

      - name: Build Page
        run: pnpm build

      - name: Go Arkade VM Contract Tests
        working-directory: contracts/go
        run: go test -v ./...
